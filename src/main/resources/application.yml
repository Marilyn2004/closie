spring:
  application:
    name: fashion-search-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fashion_search}
    username: ${DB_USERNAME:fashion}
    password: ${DB_PASSWORD:fashion}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

ebay:
  api-base-url: ${EBAY_API_BASE_URL:https://api.ebay.com}
  client-id: ${EBAY_CLIENT_ID:}
  client-secret: ${EBAY_CLIENT_SECRET:}
  marketplace-id: ${EBAY_MARKETPLACE_ID:EBAY_US}
  search-keywords:
    - leather jacket
    - cardigan
    - dress
    - sneakers
    - trousers
    - blouse
    - necklace
    - earrings
  page-size: ${EBAY_PAGE_SIZE:50}
  max-pages: ${EBAY_MAX_PAGES:2}

import:
  token: ${IMPORT_TOKEN:}

closie:
  ai:
    enabled: ${CLOSIE_AI_ENABLED:false}
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
  providers:
    permitted-sources: ${CLOSIE_PERMITTED_SOURCES:}
    ebay:
      display-enabled: ${EBAY_DISPLAY_ENABLED:false}

spring.http.clients:
  connect-timeout: 10s
  read-timeout: 20s
