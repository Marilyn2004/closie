spring:
  application:
    name: fashion-search-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/fashion_search}
    username: ${DB_USERNAME:fashion}
    password: ${DB_PASSWORD:fashion}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

ebay:
  api-base-url: ${EBAY_API_BASE_URL:https://api.ebay.com}
  client-id: ${EBAY_CLIENT_ID:}
  client-secret: ${EBAY_CLIENT_SECRET:}
  enrich-details: ${EBAY_ENRICH_DETAILS:false}
  details-per-page: ${EBAY_DETAILS_PER_PAGE:5}
  request-interval-millis: ${EBAY_REQUEST_INTERVAL_MS:200}
  marketplace-id: ${EBAY_MARKETPLACE_ID:EBAY_US}
  search-keywords: ${EBAY_SEARCH_KEYWORDS:leather jacket,cardigan,dress,sneakers,trousers,blouse,necklace,earrings,shoulder bag,tote bag}
  page-size: ${EBAY_PAGE_SIZE:50}
  max-pages: ${EBAY_MAX_PAGES:2}

import:
  token: ${IMPORT_TOKEN:}

closie:
  ebay-accounts:
    enabled: ${EBAY_ACCOUNT_TRACKING_ENABLED:false}
    hash-key: ${EBAY_ACCOUNT_HASH_KEY:}
  ebay-notifications:
    enabled: ${EBAY_NOTIFICATIONS_ENABLED:false}
    endpoint: ${EBAY_NOTIFICATION_ENDPOINT:}
    verification-token: ${EBAY_NOTIFICATION_VERIFICATION_TOKEN:}
  demo:
    enabled: ${CLOSIE_DEMO_ENABLED:false}
  refresh:
    enabled: ${CLOSIE_REFRESH_ENABLED:false}
    interval-ms: ${CLOSIE_REFRESH_INTERVAL_MS:14400000}
  ai:
    enabled: ${CLOSIE_AI_ENABLED:false}
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
  providers:
    permitted-sources: ${CLOSIE_PERMITTED_SOURCES:}
    ebay:
      display-enabled: ${EBAY_DISPLAY_ENABLED:false}

spring.http.clients:
  connect-timeout: 10s
  read-timeout: 20s
